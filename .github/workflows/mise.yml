name: mise ci

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["*"]
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@v5.1.2
      - name: Verify toolchain
        run: mise run ci
