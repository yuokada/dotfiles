[tools]
nodejs = "24"
awscli = "2.34"
python = "3.12"
bun = "1.3"
java = "temurin-25"
rust = "1.95"
quarkus = "3.40"

[tasks."brewfile:update"]
description = "Regenerate homebrew/Brewfile from installed packages"
run = "brew bundle dump --force --file=homebrew/Brewfile"

[tasks.ci]
description = "Verify every managed tool is available"
run = '''
set -eu
node --version
aws --version
python --version
bun --version
java --version
rustc --version
quarkus --version
'''
